# .ai-project.yml
# AI Project System — Project Configuration Contract
# Spec: governance/ai-project-yml-spec.md v2.1.0

governance:
  source: ./governance
  version: "4.0.0"
  ref: master

project:
  name: ai-project-system
  description: "AI Project System governance source repository"

# CFO PR review gate — Layer 8 sees PR changes before a merge happens.
# enabled (default): merge-ready PRs surface in the Progress Digest's Open Decisions
#   section for CFO diff review before merge.
# disabled: merges proceed automatically (agentic auto-merge), no gate.
# See governance/systems/creation-chat-guide.md (CFO PR Review Gate).
cfo_review_gate: enabled

# Hybrid model mapping for unattended 24/7 autonomous cluster execution
models:
  hq: remote:gpt-4o
  phase: remote:claude-3-5-sonnet
  milestone: remote:claude-3-5-sonnet
  epic_dev: local:llama3:8b
  epic_qa: local:qwen2.5-coder:7b

# Visual artifacts (M22, VA-1) — opt-in, default off. Absent block ⇒ disabled.
# enabled: false keeps the capability off in the governance source repo (the suite
# stays green without a live ComfyUI endpoint). comfyui_url/types document the
# contract but are inert while enabled is false.
# See governance/ai-project-yml-spec.md §3.5.
visual_artifacts:
  enabled: false
  comfyui_url: http://localhost:8188
  types:
    - diagrams
    - infographics
    - video
