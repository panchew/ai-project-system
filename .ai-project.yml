# .ai-project.yml
# AI Project System — Project Configuration Contract
# Spec: governance/ai-project-yml-spec.md v2.3.0

governance:
  source: ./governance
  version: "6.0.0"
  ref: master

project:
  name: ai-project-system
  description: "AI Project System governance source repository"

# CFO PR review gate — Layer 8 sees PR changes before a merge happens.
# enabled (default): merge-ready PRs surface in the Progress Digest's Open Decisions
#   section for CFO diff review before merge.
# disabled: merges proceed automatically (agentic auto-merge), no gate.
# See governance/systems/creation-chat-guide.md (CFO PR Review Gate).
cfo_review_gate: enabled

# Hybrid model mapping for unattended 24/7 autonomous cluster execution
models:
  hq: remote:gpt-4o
  phase: remote:claude-3-5-sonnet
  milestone: remote:claude-3-5-sonnet
  epic_dev: local:qwen2.5-coder:14b
  epic_qa: local:qwen2.5-coder:7b

# Visual artifacts (M22/M27, VA-1, SN-17) — default-on, opt-out via enabled: false.
# This repo opts OUT (enabled: false). Investigated dogfooding default-on restricted
# to types: [diagrams], but every `types` entry — including diagrams — is a
# Generative (ComfyUI) category (AOG §16.3; naming collision with Structural mode
# resolved in Epic E29.1, P8-M29): bin/ai-project-visual's --type diagrams is a
# ComfyUI-generative call (a txt2img workflow), not endpoint-free Mermaid/PlantUML
# output. Structural diagrams need no visual_artifacts config at all — they are
# written directly by the agent as text and never call this helper. Confirmed
# empirically: enabled: true here un-skips test_helper_generates_against_endpoint,
# which then fails with connection-refused against localhost:8188. enabled: false
# is kept to preserve the suite-green requirement; comfyui_url/types document the
# contract but are inert while disabled. See governance/ai-project-yml-spec.md §3.5.
visual_artifacts:
  enabled: false
  comfyui_url: http://localhost:8188
  types:
    - diagrams
    - infographics
    - video
  visual_required_for_specs: true
