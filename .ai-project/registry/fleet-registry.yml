# ============================================================================
# FLEET REGISTRY
# ============================================================================
#
# The fleet is a data structure, not a memory.
#
# Before this file, the authoritative list of projects on this machine lived in prose
# across a dozen phase artifacts, each correct at its date and none correct now. This
# file replaces that. Built by Epic P11-M38-E38.3 (`P11`, `M38`), which also built the
# validator whose output the `section_4` fields below record.
#
# ---------------------------------------------------------------------------
# THIS REGISTRY RECORDS STATE. IT DOES NOT ACT ON STATE.
# ---------------------------------------------------------------------------
#
# Nothing reads this file and decides what to work on next. Nothing observes the fleet
# and moves a project between states — not on a timer, not on a git event, not on
# inactivity. Deriving a work queue from fleet state is `M40`; judging completion is
# `M39`; neither is built, and neither is made easier to build carelessly by anything
# here. Transitions are a recorded human action (see `transitions:` below).
#
# Drivr reads this file (`SN-27` decision 5). Reading it and deciding is Drivr's
# coordination work, and it is Drivr's, not this file's.
#
# ---------------------------------------------------------------------------
# HOW TO READ AN ENTRY
# ---------------------------------------------------------------------------
#
#   state          one of: active | benched | archived. Definitions below, verbatim.
#   state_basis    recorded  — traceable to a decision already in the record.
#                  proposed  — this Epic's reading of the evidence. NOT a decision.
#                              The CFO owns the fleet's attention; a registry that
#                              quietly guesses is worse than one with a stated unknown.
#   enrolled       carries a `.ai-project.yml` at its root.
#   section_4      valid | invalid | not_applicable — against ai-project-yml-spec.md §4
#                  as measured by `bin/ai-project-validate` on the date below.
#
# WHERE THE RECORD IS SILENT, THIS REGISTRY PROPOSES THE WEAKER CLAIM. `benched`
# asserts only an observation ("not currently receiving attention"). `archived` asserts
# an intent ("not planned to ever be touched again") that only the CFO can hold. Absent
# a recorded statement of that intent, `benched` is proposed even where `archived` looks
# likely — see `fieldledger-assesment`, which is the case where that pinches hardest.
#
# CONSEQUENCE, STATED RATHER THAN HIDDEN: **zero projects are classified `archived`.**
# The state exists and is currently unused. That is the true state of the record, not
# an omission.

registry_version: "1.0.0"
created: 2026-08-11
created_by: Epic P11-M38-E38.3 (ai-project-system, P11-M38)
fleet_root: ~/soft-dev

# ============================================================================
# THE THREE STATES
# ============================================================================
#
# The definitions are the CFO's and are reproduced verbatim. They are not this Epic's
# to reword, narrow, or extend.
#
# ⚠ CITATION NOTE, recorded rather than smoothed: the two governing documents render
# these definitions differently. The Epic Spec's §Scope-1 table reads as reproduced
# below; the Epic Execution Chat Starter renders them as an inline parenthetical
# ("...though it can be brought back"), omitting "Enrolled in the registry." and ending
# "brought back" rather than "brought back to life". Both documents claim the text is
# verbatim, and the starter outranks the spec in the governance hierarchy. The spec's
# table form is reproduced here because it is the fuller, table-form reproduction and
# the starter's reads as a parenthetical compression of it. The discrepancy is reported
# to the Milestone Chat rather than resolved unilaterally.

states:
  active:
    definition: "Enrolled in the registry. Receives time and attention."
  benched:
    definition: "Not currently receiving attention. May return."
  archived:
    definition: "Not planned to ever be touched again — though it can be brought back to life."

# ============================================================================
# ENUMERATION METHOD — stated so the count is checkable
# ============================================================================
#
# Measured 2026-08-11 on the host, at `~/soft-dev`.
#
#   find ~/soft-dev -maxdepth 1 -mindepth 1 -type d
#     -> 17 directories
#
# Two of those 17 are NOT projects: `worktree-epic-E38.2` and `worktree-epic-E38.3` are
# git worktrees of `ai-project-system` itself, confirmed by `git worktree list` and by
# each holding a `.git` FILE containing
# `gitdir: .../ai-project-system/.git/worktrees/...`. They carry a `.ai-project.yml`
# only because they are checkouts of this repository, and a naive
# `for d in */; do [ -f "$d/.ai-project.yml" ]` counts them as fleet members — which is
# exactly the method defect this Epic exists to guard against. They are excluded here,
# with the exclusion stated rather than silent.
#
#   17 directories − 2 worktrees          = 15 project directories
#   15 projects, of which 13 carry a config = 13 enrolled / 2 unenrolled
#
# Three entries in `~/soft-dev` are loose `.md` files, not directories, and are excluded
# by `-type d`: `interview-cheatsheet-telos-technical.md`,
# `interview-prep-luflox-rails-ai.md`, `interview-prep-telos.md`.
#
# Counts are floors carrying their date. `panchew-io` was the third fleet list to prove
# short; `drivr` made a fourth; the two worktrees make a fifth.

enumeration:
  measured: 2026-08-11
  directories_found: 17
  excluded_as_worktrees: [worktree-epic-E38.2, worktree-epic-E38.3]
  project_directories: 15
  enrolled: 13
  unenrolled: 2
  section_4_valid: 9
  section_4_invalid: 4

# ============================================================================
# §4 VALIDATION — as measured, not as remembered
# ============================================================================
#
# Command:  bin/ai-project-validate --fleet ~/soft-dev
# Date:     2026-08-11
# Repo:     ai-project-system @ epic/P11-M38-E38.3
#
# 4 of 13 enrolled configs are §4-INVALID, carrying 8 errors between them.
#
# RECONCILIATION with the two figures already in the record, neither of which is wrong:
#
#   "3 of 6 invalid at P10 close"  (P11-M38 milestone spec) — a DIFFERENT SCOPE: six
#       projects, not thirteen. Not comparable, and not contradicted.
#   "4 of 12 invalid"  (E38.3 spec Finding 3, 2026-08-08) — required-field PRESENCE
#       only, before any format constraint was checked, over twelve enrolled projects.
#
#   This measurement: 4 of 13, over the same four projects, 2026-08-11, full §4.
#
# The spec predicted "your number will be higher than four." The number of invalid
# PROJECTS did not move — it is the same four. The number of VIOLATIONS did: presence-
# only found 5, full §4 found 8. The three additional violations are `home_finance`'s
# `project.name` (rule 7 — `home_finance` contains an underscore, which
# `^[a-z][a-z0-9-]*$` does not admit) and `social-stories-creator`'s
# `governance.version: v7.0.0` (rule 5, twice — unquoted, and not bare semver).
# No project became invalid that was not already invalid on presence alone.

validation:
  measured: 2026-08-11
  command: bin/ai-project-validate --fleet ~/soft-dev
  invalid_configs: 4
  total_errors: 8
  total_warnings: 14

# ============================================================================
# TRANSITIONS — a recorded human action. Nothing automatic.
# ============================================================================
#
# Binding Constraint 5 (`P11-M38`), a returned CFO proposal and therefore not assumed:
# fleet-state transitions are NOT executed by Drivr or by anything else. A transition is
# a human decision, appended here by hand, recording who / when / from / to / why.
#
# NOTHING AUTOMATIC EXISTS. No timer, no git hook, no inactivity rule, no scheduler, no
# derived queue reads or writes this list. If the CFO rules otherwise, that is an
# amendment at the milestone level, not an epic's or a tool's discretion.
#
# Schema for an appended entry:
#
#   - project: <directory name>
#     from: <state>            # or `unclassified` for a first classification
#     to: <state>
#     date: <YYYY-MM-DD>
#     by: <who decided>        # a person, or a chat acting on a recorded instruction
#     why: <the reason>
#
# The list is empty because this file's initial classifications are not transitions —
# they are the registry's first state, and the `proposed` ones are not decisions at all.

transitions: []

