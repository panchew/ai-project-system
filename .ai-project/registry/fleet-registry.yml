findings:

  init_produces_invalid_configs:
    summary: >-
      `bin/ai-project-init` generates a `.ai-project.yml` that ai-project-yml-spec.md §4
      calls INVALID. `create_ai_project_yml()` writes `project.name`,
      `project.created_at`, `governance.source`, `governance.version` and
      `governance.submodule_path`. It does NOT write `governance.ref` (required, rules 3
      and 6) or `project.description` (required, rules 3 and 8). It also writes
      `created_at` and `submodule_path`, neither of which appears anywhere in the schema.
    second_defect: >-
      There are TWO validators in this framework and they enforce different contracts.
      `bin/ai-project-init`'s internal `validate_ai_project_yml_content()` requires
      `created_at` — which the schema does not define — and does not require `ref` or
      `description` — which the schema requires. The contract that is written down is
      not the contract that is enforced.
    blast_radius: >-
      Three of the four §4-invalid configs (`ai-project-system-mcp`, `courtis`,
      `home_finance`) are missing exactly `project.description`, and the fourth
      (`social-stories-creator`) is missing `description` AND `ref`. All four are
      init-created. The defect is not latent; it is the direct cause of the fleet's
      §4 invalidity.
    drivr_outcome: >-
      RESOLVED THE GOOD WAY, and verified against drivr as it actually landed rather
      than taken from its spec. E38.1's spec was amended to v1.1.0 on this finding and
      required four post-init additions plus one correction and a §4 self-check; E38.1
      delivered them. `bin/ai-project-validate` reports drivr §4-VALID (2 warnings,
      0 errors) as of 2026-08-11, at drivr HEAD `31dad51`.
    disposition: "NOT FIXED. Recorded and escalated to the Milestone Chat."

  schema_drift_class:
    summary: >-
      `framework_version` was not alone. Four fields appeared in live configs with no
      schema entry. This Epic blessed exactly one of them, by decision; the other three
      are recommend-and-escalate, not act.
    measured: 2026-08-11
    scope: 13 enrolled projects
    fields:
      - field: framework_version
        in_configs: 7 of 13
        spec_occurrences_before: 0
        disposition: "BLESSED — ai-project-yml-spec.md §3.6 + §4 rule 26, optional (P10-GH-1)."
      - field: created_at
        in_configs: 5 of 13
        spec_occurrences: 0
        written_by_init: true
        disposition: "NOT BLESSED. Warned by the validator, escalated for a ruling."
      - field: submodule_path
        in_configs: 5 of 13
        spec_occurrences: 0
        written_by_init: true
        disposition: "NOT BLESSED. Warned by the validator, escalated for a ruling."
      - field: cfo_review_gate
        in_configs: 2 of 13
        spec_occurrences: "1 — a prose aside in §3.5, never a schema entry"
        written_by_init: false
        disposition: "NOT BLESSED. Warned by the validator, escalated for a ruling."
    unknown_key_gap: >-
      §4 has no rule for unknown keys at the top level or inside `governance:` and
      `project:` — its unknown-key rules 11, 16 and 22 cover only `overrides`, `models`
      and `visual_artifacts`. `bin/ai-project-validate` WARNS, as a documented validator
      decision reported with no rule number, on the reasoning that warning is the only
      treatment the document evidences anywhere. The gap itself is NOT closed here:
      filling a normative silence by fiat is a larger change than this Epic was
      authorized to make. Escalated.

  finding_6_miscounted:
    summary: >-
      The E38.3 spec's Finding 6 (v1.2.0, 2026-08-11) recorded the installed
      `governance.agent.md` as "canonical x10, stub x1, absent x2". Re-measured
      exhaustively — every `governance.agent.md` at any depth in every project, rather
      than the single `.ai-project/agents/` path — the picture differs.
    corrections:
      - "`fieldledger-assesment` is NOT absent. It carries a 14,352 B (pre-v7.0.0) copy at `.governance/governance/agents/`. It is STALE, not missing."
      - "A fourth state exists: STALE. 14,352 B is an older canonical, not the 230 B stub and not absent."
      - "`footboard` carries BOTH — 14,711 B at the two live paths and a stale 14,352 B leftover at `.github/agents/`. A per-project single value cannot represent it."
      - "`social-stories-creator`'s stub is only its INSTALLED copy; the canonical 14,711 B file is present and correct inside its own submodule. The submodule was rolled forward; the install was not."
      - "Only `character-factory` has no `governance.agent.md` anywhere at any depth."
    cause: >-
      A measurement layer, not a fleet change: Finding 6 looked at one install path and
      the fleet uses more than one. This is `P11-GH-2`'s named failure — verification
      performed at the wrong layer — arriving inside the Epic whose own subject is that
      a count is only as good as the pattern behind it.
    disposition: >-
      RECORDED, NOT REPAIRED. No agent was re-installed, no submodule moved, no stale
      copy deleted. The registry's `installed_agent` field carries the four states.
